<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Restaurants | The Dispatchers</title>
    <link rel="stylesheet" href="/frontend/styles.css">
    <script src="/frontend/navbar.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">The Dispatchers</a>
        <span>Restaurant management</span>
    </header>

    <nav id="site-nav" aria-label="Main navigation"></nav>

    <p id="access-message" role="status" style="padding: 24px;">
        Checking account permissions...
    </p>

    <main id="manage-content" hidden>
        <section>
            <a href="/">&larr; Back to restaurants</a>
            <h1>Manage Restaurants</h1>
            <p id="error" class="error" role="alert"></p>
            <p id="success" role="status" style="color:#27633c"></p>

            <div>
                <label for="restaurant-select">Pick a restaurant to edit</label>
                <select id="restaurant-select"></select>
            </div>
        </section>

        <section>
            <form id="restaurant-form" class="search-controls" style="flex-direction:column; align-items:stretch">
                <div><label for="r-name">Name</label><input id="r-name" required></div>
                <div><label for="r-cuisine">Cuisine</label><input id="r-cuisine" required></div>
                <div><label for="r-rating">Rating (0-5)</label><input id="r-rating" type="number" step="0.1" min="0" max="5" required></div>
                <div><label for="r-time">Delivery time (minutes)</label><input id="r-time" type="number" min="0" required></div>
                <div><label for="r-fee">Delivery fee</label><input id="r-fee" type="number" step="0.01" min="0" required></div>
                <div><label for="r-address">Address</label><input id="r-address" required></div>
                <div><label><input id="r-open" type="checkbox" checked style="width:auto; min-height:0"> Open</label></div>
                <button type="submit" id="r-submit">Create restaurant</button>
            </form>
        </section>
    </main>

    <script>
            const $ = id => document.getElementById(id);
            let restaurantId = null;

            function showError(msg) {
                $("error").textContent = msg;
                $("success").textContent = "";
            }

            function showSuccess(msg) {
                $("success").textContent = msg;
                $("error").textContent = "";
            }

            async function errorMessage(res) {
                try {
                    const body = await res.json();

                    if (typeof body.detail === "string") {
                        return body.detail;
                    }

                    if (Array.isArray(body.detail)) {
                        return body.detail.map(
                            d => d.loc.join(".") + ": " + d.msg
                        ).join("; ");
                    }
                } catch (error) {
                    console.error(error);
                }

                return "Request failed (" + res.status + ")";
            }

            async function api(method, path, body) {
                const options = {
                    method: method,
                    headers: {}
                };

                const token = sessionStorage.getItem("access_token");

                if (token) {
                    options.headers["Authorization"] = "Bearer " + token;
                }

                if (body) {
                    options.headers["Content-Type"] = "application/json";
                    options.body = JSON.stringify(body);
                }

                const res = await fetch(path, options);

                if (!res.ok) {
                    throw new Error(await errorMessage(res));
                }

                return res.json();
            }

            async function loadDropdown(selectedId) {
                const select = $("restaurant-select");

                select.replaceChildren(
                    new Option("-- New restaurant --", "")
                );

                const restaurants = await api("GET", "/restaurants/mine");

                restaurants.forEach(restaurant => {
                    select.add(new Option(
                        restaurant.id + ": " + restaurant.name,
                        restaurant.id
                    ));
                });

                select.value = selectedId ? String(selectedId) : "";
            }

            function fillForm(restaurant) {
                $("r-name").value = restaurant ? restaurant.name : "";
                $("r-cuisine").value = restaurant ? restaurant.cuisine : "";
                $("r-rating").value = restaurant ? restaurant.rating : "";
                $("r-time").value = restaurant
                    ? restaurant.delivery_time_minutes : "";
                $("r-fee").value = restaurant ? restaurant.delivery_fee : "";
                $("r-address").value = restaurant ? restaurant.address : "";
                $("r-open").checked = restaurant ? restaurant.is_open : true;

                $("r-submit").textContent = restaurant
                    ? "Update restaurant"
                    : "Create restaurant";
            }

            $("restaurant-select").addEventListener("change", async event => {
                restaurantId = event.target.value
                    ? Number(event.target.value)
                    : null;

                try {
                    const restaurant = restaurantId
                        ? await api("GET", "/restaurants/" + restaurantId)
                        : null;

                    fillForm(restaurant);
                    $("error").textContent = "";
                    $("success").textContent = "";

                } catch (error) {
                    showError(error.message);
                }
            });

            $("restaurant-form").addEventListener("submit", async event => {
                event.preventDefault();

                const body = {
                    name: $("r-name").value.trim(),
                    cuisine: $("r-cuisine").value.trim(),
                    rating: Number($("r-rating").value),
                    delivery_time_minutes: Number($("r-time").value),
                    delivery_fee: Number($("r-fee").value),
                    address: $("r-address").value.trim(),
                    is_open: $("r-open").checked
                };

                try {
                    const saved = restaurantId
                        ? await api("PUT", "/restaurants/" + restaurantId, body)
                        : await api("POST", "/restaurants", body);

                    restaurantId = saved.id;

                    await loadDropdown(saved.id);
                    fillForm(saved);

                    showSuccess(
                        'Saved "' + saved.name + '" (id ' + saved.id + ")."
                    );

                } catch (error) {
                    showError(error.message);
                }
            });

            async function checkAccess() {
                const token = sessionStorage.getItem("access_token");

                if (!token) {
                    $("access-message").textContent =
                        "Please log in as a restaurant owner or admin.";
                    return;
                }

                try {
                    const response = await fetch("/auth/me", {
                        headers: {
                            "Authorization": "Bearer " + token
                        }
                    });

                    if (response.status === 401) {
                        sessionStorage.removeItem("access_token");

                        $("access-message").textContent =
                            "Your login has expired. Please log in again.";
                        return;
                    }

                    if (!response.ok) {
                        $("access-message").textContent =
                            "Could not check your account permissions.";
                        return;
                    }

                    const user = await response.json();

                    if (user.role !== "restaurant owner" &&
                        user.role !== "admin") {
                        $("access-message").textContent =
                            "You do not have permission to manage restaurants.";
                        return;
                    }

                    $("access-message").hidden = true;
                    $("manage-content").hidden = false;

                    await loadDropdown();

                } catch (error) {
                    $("access-message").textContent =
                        "Could not load the restaurant management page.";
                    console.error(error);
                }
            }

            checkAccess();
    </script>
</body>
</html>
