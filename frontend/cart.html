<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | The Dispatchers</title>
    <link rel="stylesheet" href="/frontend/styles.css">
    <script src="/frontend/navbar.js" defer></script>
    <script src="/frontend/cart.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">The Dispatchers</a>
    </header>
    <nav id="site-nav" aria-label="Main navigation"></nav>
    <main>
        <h1>Your Cart</h1>
        <p id="cart-status" role="status">Loading your cart…</p>
        <p id="cart-error" class="error" role="alert"></p>
        <a id="cart-login" href="/frontend/login.html" hidden>Sign in</a>
        <section id="cart-contents" hidden>
            <div id="cart-items" class="menu-grid"></div>
            <div id="cart-summary" class="restaurant-info"></div>
        </section>
        <p><a href="/">&larr; Browse restaurants</a></p>
    </main>
</body>
</html>
