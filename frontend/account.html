<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | The Dispatchers</title>
    <link rel="stylesheet" href="/frontend/styles.css">
    <script src="/frontend/navbar.js" defer></script>
    <script src="/frontend/account.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">The Dispatchers</a>
    </header>
    <nav id="site-nav" aria-label="Main navigation"></nav>
    <main>
        <h1>My Account</h1>
        <form id="account-form" class="search-controls"
              style="flex-direction: column; align-items: stretch; max-width: 480px;" hidden>
            <div>
                <label for="name">Name</label>
                <input id="name" type="text" autocomplete="name" required>
            </div>
            <div>
                <label for="email">Sign-in email</label>
                <input id="email" type="email" readonly>
            </div>
            <div>
                <label for="saved-address">Saved delivery address</label>
                <input id="saved-address" type="text" readonly>
            </div>
            <div>
                <label for="address-action">Delivery address changes</label>
                <select id="address-action">
                    <option value="keep">Keep current address</option>
                    <option value="update">Add or edit address</option>
                    <option value="clear">Remove saved address</option>
                </select>
            </div>
            <fieldset id="address-fields" hidden disabled>
                <legend>Delivery address</legend>
                <label for="street">Street address (include unit if applicable)</label>
                <input id="street" autocomplete="street-address" required>
                <label for="city">City</label>
                <input id="city" autocomplete="address-level2" required>
                <label for="region">Province, state, or region</label>
                <input id="region" autocomplete="address-level1" required>
                <label for="postal_code">Postal code</label>
                <input id="postal_code" autocomplete="postal-code" required>
                <label for="country">Country</label>
                <input id="country" autocomplete="country-name" required>
            </fieldset>
            <button type="submit">Save changes</button>
        </form>
        <section id="deactivation-section" hidden aria-labelledby="deactivation-title">
            <h2 id="deactivation-title">Deactivate account</h2>
            <p>You’ll be signed out and lose access to your account and cart. Existing orders will be retained.</p>
            <button id="deactivate-account" type="button">Deactivate my account</button>
        </section>
        <p id="account-status" role="status">Loading your profile…</p>
        <p id="account-error" class="error" role="alert"></p>
        <a id="account-login" href="/frontend/login.html" hidden>Sign in</a>
    </main>
</body>
</html>
